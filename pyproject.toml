[project]
name = "ball-or-nothing"
version = "0.1.0"
description = "BALL OR NOTHING - a Stake Engine slot game"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
pythonVersion = "3.12"
extraPaths = ["src"]
